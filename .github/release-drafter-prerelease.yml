---
# Prerelease (rc) track: drafts vX.Y.Z-rc.N. With prerelease-identifier set,
# only the rc suffix increments between published prereleases, so shipping
# several rcs never consumes stable version numbers -- the stable track
# (release-drafter.yml config) resolves from the last stable release only,
# and the -rc.N suffix keeps the two tracks' tags from colliding. Keep
# version-resolver/categories in sync with the stable config. No autolabeler
# here: the stable track's job handles PR labeling.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
prerelease: true
prerelease-identifier: "rc"
version-resolver:
  # A `!` in a Conventional-Commit title (e.g. `feat!:`) gives the PR the
  # `breaking` label instead of its type label. Below 1.0 a breaking change
  # bumps the minor version like a feature; move it to `major` once this
  # reaches 1.0.
  minor:
    labels: ["breaking", "enhancement", "feature"]
  patch:
    labels: ["bug", "fix", "chore", "dependencies", "ci"]
  default: patch
categories:
  # A PR is listed under every category it matches, so a breaking PR carries
  # only the `breaking` label (not its type label) to appear here alone.
  - title: "⚠️ Breaking changes"
    labels: ["breaking"]
  - title: "New Features"
    labels: ["enhancement", "feature"]
  - title: "Bug Fixes"
    labels: ["bug", "fix"]
  - title: "Maintenance"
    labels: ["chore", "dependencies", "ci"]
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
