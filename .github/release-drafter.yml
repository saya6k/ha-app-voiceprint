---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-resolver:
  # A `!` in a Conventional-Commit title (e.g. `feat!:`) gives the PR the
  # `breaking` label instead of its type label. Below 1.0 a breaking change
  # bumps the minor version like a feature; move it to `major` once this
  # reaches 1.0.
  minor:
    labels: ["breaking", "enhancement", "feature"]
  patch:
    labels: ["bug", "fix", "chore", "dependencies", "ci"]
  default: patch
categories:
  # A PR is listed under every category it matches, so a breaking PR carries
  # only the `breaking` label (not its type label) to appear here alone.
  - title: "⚠️ Breaking changes"
    labels: ["breaking"]
  - title: "New Features"
    labels: ["enhancement", "feature"]
  - title: "Bug Fixes"
    labels: ["bug", "fix"]
  - title: "Maintenance"
    labels: ["chore", "dependencies", "ci"]
autolabeler:
  - label: breaking
    title:
      - '/^[a-z]+(\(.+\))?!:/i'
  - label: enhancement
    title:
      - '/^feat(\(.+\))?:/i'
  - label: fix
    title:
      - '/^(fix|perf|revert)(\(.+\))?:/i'
  - label: chore
    title:
      - '/^(chore|ci|docs|refactor|build|style|test)(\(.+\))?:/i'
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
